[package]
name = "dnsdoc"
version = "0.4.1"
edition = "2024"
repository = "https://github.com/barun-labs/dnsdoc"

[dependencies]
anyhow = "1.0.104"
chrono = "0.4.45"
crossterm = "0.29.0"
dirs = "6.0.0"
futures = "0.3.33"
hickory-client = "0.25.2"
# dnssec-ring: typed RRSIG/DS/DNSKEY rdata (RData::DNSSEC) for the DNSSEC tab
hickory-proto = { version = "0.25", features = ["dnssec-ring"] }
hickory-resolver = "0.25"
rand = "0.10.2"
ratatui = "0.30.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["full"] }
toml = "1.1.4"
