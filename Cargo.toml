[package]
name = "dnsdoc"
version = "0.2.0"
edition = "2024"
repository = "https://github.com/barun-labs/dnsdoc"

[dependencies]
anyhow = "1.0.104"
chrono = "0.4.45"
crossterm = "0.29.0"
dirs = "6.0.0"
futures = "0.3.33"
hickory-client = "0.25.2"
hickory-proto = "0.25"
hickory-resolver = "0.25"
rand = "0.10.2"
ratatui = "0.30.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["full"] }
toml = "1.1.4"
